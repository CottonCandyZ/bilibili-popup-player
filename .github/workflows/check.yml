name: Check

on: pull_request

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview_ready: ${{ steps.preview-config.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm check && pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser regression
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm exec playwright test test/browser/pip-activation.spec.js test/browser/pip-support.spec.js test/browser/shadow-cards.spec.js test/browser/watch-later.spec.js
      - name: Check preview configuration
        id: preview-config
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'PR preview skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi

  preview:
    name: PR preview
    needs: check
    if: needs.check.outputs.preview_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      url: ${{ steps.prepare.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare preview userscript
        id: prepare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prepare-preview.mjs
      - run: pnpm check
      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: pnpm exec node scripts/deploy-pages.mjs
      - name: Verify preview userscript
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-published-userscript.mjs dist/bilibili-popup-player-nano.user.js; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
      - name: Add test links
        env:
          PREVIEW_URL: ${{ steps.prepare.outputs.url }}
          INSTALL_URL: ${{ steps.prepare.outputs.install_url }}
        run: |
          echo "[打开 PR 测试安装页]($PREVIEW_URL) · [直接安装测试脚本]($INSTALL_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo '测试前请在脚本管理器中停用正式版和其他 PR 预览版。' >> "$GITHUB_STEP_SUMMARY"
